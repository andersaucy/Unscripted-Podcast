<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unscripted-Podcast</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div id="app" class="app">
        <header class="app__header">
            <h1 class="app__title">Unscripted&#8209;Podcast</h1>
            <p class="app__subtitle">Podcast automation panel</p>
        </header>

        <section class="config">
            <label class="config__label" for="clipCount">Clip Count</label>
            <input id="clipCount" class="config__input" type="number" min="0" step="1"
                inputmode="numeric" placeholder="auto" />
            <button id="btnDetect" class="config__btn" type="button"
                title="Read the clip count from PodcastClips.txt">Detect from .txt</button>
        </section>

        <main class="actions">
            <div class="actions__group">
                <div class="actions__heading">Episode Setup</div>

                <button id="btnImportFootage" class="action action--primary" type="button">
                    <span class="action__title">
                        <span class="action__label">Import &amp; Configure Footage</span>
                        <span class="action__states">
                            <span id="episodeIdentityState" class="action__state action__state--episode">Episode: checking…</span>
                            <span id="importFootageState" class="action__state action__state--video">Import: checking…</span>
                            <span id="configureAudioState" class="action__state action__state--audio">Audio: checking…</span>
                        </span>
                    </span>
                    <span class="action__desc">First set the V2 MOGRT’s Episode Number from PODCAST### and rename LowRes to ### LowRes_v1; then import 01_Assets/Footage and configure MXF/WAV audio.</span>
                </button>

                <button id="btnCreateMulticams" class="action action--primary" type="button">
                    <span class="action__label">Create Episode Multicams</span>
                    <span class="action__desc">Build and verify INTRO-### and TALK-### from matching cameras, WAV recorders, and the sync MP3, then open both Timeline tabs.</span>
                </button>

                <button id="btnFinishTalk" class="action" type="button">
                    <span class="action__label">Finish TALK Layout</span>
                    <span class="action__desc">Separately arrange WAV P1/P2 on A1-A3, sync MP3 on A4, and place Zencastr video/audio on V2/A5.</span>
                </button>

            </div>

            <div class="actions__group">
                <div class="actions__heading">Editing &amp; Export</div>

                <button id="btnMarkClips" class="action" type="button">
                    <span class="action__label">Mark Clips</span>
                    <span class="action__desc">Read PodcastClips.txt, mark the episode LowRes sequence, build clip sequences and transitions. Uses the Clip Count above (auto from the .txt).</span>
                </button>

                <button id="btnCollectEpisode" class="action" type="button">
                    <span class="action__label">Collect &amp; Save Episode</span>
                    <span class="action__desc">Save this project, then create a self-contained episode copy beside 01_Assets and 00_Projects with all project media and sequences.</span>
                </button>

                <button id="btnRender" class="action" type="button">
                    <span class="action__label">Render / Queue in AME</span>
                    <span class="action__desc">Send every sequence in ExportBin to Adobe Media Encoder.</span>
                </button>
            </div>
        </main>

        <section class="status" aria-live="polite">
            <div class="status__bar">
                <span id="statusText" class="status__text">Ready.</span>
                <span class="status__controls">
                    <button id="btnToggleLog" class="status__clear" type="button" title="Expand activity log">Expand Log</button>
                    <button id="btnClearLog" class="status__clear" type="button" title="Clear log">Clear</button>
                </span>
            </div>
            <pre id="log" class="log"></pre>
        </section>
    </div>

    <script src="js/CSInterface.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
